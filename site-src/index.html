<title>מרחב הלמידה המשותף</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;700;800;900&family=Heebo:wght@300;400;500;700&display=swap">
<style>
/* Editorial look: warm paper page, deep green ink, a terracotta accent used sparingly. Rubik (light/black) for display,
   Heebo for reading. Official content sits on a cream "paper" band; participant content is quieter, on plain surfaces. */
:root{
  --bg:#f5f1e8; --surface:#fffdf8; --sunk:#ebe5d8; --ink:#17211d; --muted:#5e665f; --line:#ddd5c4;
  --accent:#0e5446; --accent-ink:#fffdf8; --accent-soft:#dde9e1; --hot:#c2502f;
  --official:#f1e6c8; --official-line:#c9a64a; --official-ink:#5c4300;
  --q:#3a4a8f; --q-soft:#e4e6f2; --danger:#a63a26;
  --f-display:"Rubik","Heebo","Segoe UI",sans-serif;
  --f-body:"Heebo","Segoe UI",sans-serif;
  --r:4px; --shadow:0 1px 0 rgba(23,33,29,.06),0 10px 30px -18px rgba(23,33,29,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#19211d; --sunk:#222c27; --ink:#ece6d8; --muted:#a6ada4; --line:#2f3a34;
  --accent:#6cc3a8; --accent-ink:#0b1a15; --accent-soft:#1d3229; --hot:#ec8a68;
  --official:#2a2416; --official-line:#8c7434; --official-ink:#ecd395;
  --q:#a7b4f2; --q-soft:#232a45; --danger:#f0907c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#19211d; --sunk:#222c27; --ink:#ece6d8; --muted:#a6ada4; --line:#2f3a34;
  --accent:#6cc3a8; --accent-ink:#0b1a15; --accent-soft:#1d3229; --hot:#ec8a68;
  --official:#2a2416; --official-line:#8c7434; --official-ink:#ecd395;
  --q:#a7b4f2; --q-soft:#232a45; --danger:#f0907c; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;font-weight:400;line-height:1.65;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;padding-block:14px 6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.02rem;letter-spacing:-.01em;text-decoration:none;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand::before{content:"";display:inline-block;width:10px;height:10px;background:var(--hot);margin-inline-end:10px;vertical-align:1px}
.who{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.who img{width:28px;height:28px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:2px;padding:1px 8px;font-size:.74rem;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill.fac{background:var(--official);color:var(--official-ink)}
.pill.prev{background:var(--hot);color:#fffdf8}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-10px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:10px 10px 12px;border-bottom:2px solid transparent;font-weight:500;font-size:.95rem}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--hot)}

main{padding-block:40px 96px;display:flex;flex-direction:column;gap:56px}
.notice{background:var(--sunk);border-radius:var(--r);padding:12px 18px;font-size:.95rem}
.notice.warn{background:var(--official);color:var(--official-ink)}
.preview-bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r);font-size:.95rem}
.preview-bar b{font-family:var(--f-display);font-weight:800}
.preview-bar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}

/* buttons */
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 16px;cursor:pointer;font-weight:700;font-size:.92rem;text-decoration:none;color:var(--ink);transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.btn.small{padding:4px 12px;font-size:.84rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* hero: oversized light/black title, then an asymmetric band with the central question as a pull quote */
.hero{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--hot);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:0 0 48px;height:1px;background:currentColor}
.hero h1{font-size:clamp(2.6rem,8vw,5.4rem);font-weight:900;letter-spacing:-.025em;line-height:1}
.hero h1 .thin{font-weight:300;display:block;color:var(--accent)}
.context{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:0;margin-top:18px;background:var(--official);border-radius:var(--r);overflow:hidden}
.context .ctx-q{grid-row:1/3;padding:clamp(24px,4vw,44px);background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:14px;justify-content:center}
.context .ctx-q h3{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.context .ctx-q p{font-family:var(--f-display);font-size:clamp(1.35rem,3vw,2.05rem);font-weight:300;line-height:1.35}
.context .ctx-q p::before{content:"״";display:block;font-weight:900;font-size:3.4em;line-height:.6;color:var(--hot);margin-bottom:6px}
.context>div:not(.ctx-q){padding:clamp(20px,3vw,32px)}
.context>div:not(.ctx-q)+div:not(.ctx-q){border-top:1px solid var(--official-line)}
.context h3{font-family:var(--f-body);font-size:.76rem;letter-spacing:.12em;color:var(--official-ink);font-weight:700;margin-bottom:8px}
.context p{margin:0;white-space:pre-line;max-width:62ch}
.official-tag{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:700;color:var(--official-ink);letter-spacing:.1em}
.official-tag::before{content:"";width:18px;height:2px;background:var(--official-line)}
@media (max-width:760px){.context{grid-template-columns:1fr}.context .ctx-q{grid-row:auto;order:-1}}

/* section heads */
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.sec-head h2{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800;letter-spacing:-.015em}
.sec-head p{margin:0;color:var(--muted);font-size:.92rem}

/* sessions: a timeline strip instead of equal cards; the next session is set apart */
.sessions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.sessions li{border-inline-start:1px solid var(--line)}
.sessions li:first-child{border-inline-start:0}
.s-card{position:relative;display:flex;flex-direction:column;gap:6px;height:100%;padding:18px 16px 20px;text-decoration:none;color:var(--ink);transition:background .15s}
.s-card::before{content:"";position:absolute;top:-1px;inset-inline:0;height:3px;background:var(--accent)}
.s-card.upcoming::before{background:transparent}
.s-card.next{background:var(--surface);box-shadow:var(--shadow)}
.s-card.next::before{background:var(--hot)}
.s-card:hover{background:var(--surface)}
.s-num{font-family:var(--f-display);font-size:3.4rem;font-weight:900;line-height:.9;color:var(--accent);letter-spacing:-.04em}
.s-card.upcoming .s-num{color:transparent;-webkit-text-stroke:1.5px var(--muted)}
.s-card.next .s-num{color:var(--hot);-webkit-text-stroke:0}
.s-flag{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--hot)}
.s-date{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.s-title{font-weight:700;line-height:1.3;font-size:.98rem}
.s-meta{margin-top:auto;padding-top:8px;font-size:.78rem;color:var(--muted)}
@media (max-width:860px){.sessions{grid-template-columns:repeat(3,minmax(0,1fr))}.sessions li:nth-child(4){border-inline-start:0}.sessions li:nth-child(n+4){border-top:1px solid var(--line)}}
@media (max-width:480px){.sessions{grid-template-columns:repeat(2,minmax(0,1fr))}.sessions li{border-inline-start:1px solid var(--line)!important;border-top:1px solid var(--line)}.sessions li:nth-child(odd){border-inline-start:0!important}}

/* quick access: big numbers, no boxes */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 28px}
.q-tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.q-tile .big{grid-row:1/3;font-family:var(--f-display);font-weight:300;font-size:2.8rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.q-tile:hover .big{color:var(--hot)}
.q-tile b{font-size:1.02rem;font-weight:700}
.q-tile span{font-size:.85rem;color:var(--muted)}
.q-tile .count{font-variant-numeric:tabular-nums}

/* official panel on session page */
.panel-off{background:var(--official);border-radius:var(--r);padding:clamp(22px,4vw,40px);display:flex;flex-direction:column;gap:22px;border-inline-start:4px solid var(--official-line)}
.panel-off h3{font-size:1.2rem;font-weight:800;margin-bottom:6px}
.panel-off .body{white-space:pre-line;max-width:70ch;margin:0}
.panel-off ul{margin:0;padding-inline-start:20px}
.panel-off li{margin-bottom:4px}
.empty-soft{color:var(--muted);font-style:italic;margin:0}
.s-head{display:flex;flex-direction:column;gap:10px}
.s-head h1{font-size:clamp(2rem,5.5vw,3.6rem);font-weight:900;letter-spacing:-.02em}
.s-head .desc{max-width:65ch;margin:0;color:var(--muted);font-size:1.08rem;font-weight:300;white-space:pre-line}
.s-pager{display:flex;justify-content:space-between;gap:10px;border-top:2px solid var(--ink);padding-top:16px}

/* items */
.list{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.item{background:var(--surface);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow);transition:transform .15s}
.item:hover{transform:translateY(-2px)}
.item.is-official{background:var(--official);box-shadow:none;border-inline-start:3px solid var(--official-line)}
.item h3{font-family:var(--f-display);font-size:1.12rem;font-weight:700;overflow-wrap:anywhere}
.item h3 a{color:var(--ink);text-decoration:none;background-image:linear-gradient(var(--hot),var(--hot));background-size:0 2px;background-position:100% 100%;background-repeat:no-repeat;transition:background-size .2s}
.item h3 a:hover{background-size:100% 2px}
.item p{margin:0;overflow-wrap:anywhere;white-space:pre-line;color:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.82rem;color:var(--muted)}
.author{display:inline-flex;align-items:center;gap:6px}
.author img{width:20px;height:20px;border-radius:50%}
.chip{display:inline-block;border-radius:2px;padding:0 7px;font-size:.72rem;font-weight:700;letter-spacing:.04em;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.kind{background:var(--accent-soft);color:var(--accent)}
.chip.q{background:var(--q-soft);color:var(--q)}
.chip.off{background:var(--official-line);color:#fffdf8}
.item .actions{display:flex;gap:6px;justify-content:flex-start}
.book-by{color:var(--muted);font-size:.92rem;font-weight:300}
.hint{color:var(--muted);font-size:.9rem;margin:0}

.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;padding:14px 0;border-bottom:1px solid var(--line)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;letter-spacing:.08em;color:var(--muted);font-weight:700;flex:1 1 150px;min-width:0}
select,input[type=text],input[type=url],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 11px;min-width:0}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:96px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 14px;cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.cat{display:flex;flex-direction:column;gap:18px}
.cat-head{display:flex;gap:16px;align-items:flex-start}
.cat-n{font-family:var(--f-display);font-weight:900;font-size:2.6rem;line-height:.9;color:var(--accent);min-width:1.1em;letter-spacing:-.04em}
.cat-head h3{font-size:1.3rem;font-weight:800}
.cat-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem;max-width:70ch}
.ins{border-inline-start:3px solid var(--accent);padding:12px 18px;background:var(--surface);border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:6px}
.ins.question{border-inline-start-color:var(--q)}
.ins p{margin:0;white-space:pre-line;overflow-wrap:anywhere;font-size:1.02rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(18,24,21,.55);backdrop-filter:blur(2px);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:640px;padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);border-top:4px solid var(--accent)}
.modal h2{font-size:1.5rem;font-weight:800}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-weight:700;font-size:.9rem}
.field small{color:var(--muted);font-size:.82rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.err{color:var(--danger);font-size:.9rem;margin:0}
.check{display:flex;gap:8px;align-items:center;font-weight:700}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0}
legend{font-weight:700;font-size:.9rem;padding:0 4px}
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:5px 12px;cursor:pointer;font-weight:700}
.rating label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb-card{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.fb-card dl{margin:0;display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:4px 12px}
.fb-card dt{color:var(--muted);font-size:.85rem}
.fb-card dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;list-style:none;margin:0;padding:0}
.gallery li{position:relative;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.gallery li:first-child{grid-column:span 2;grid-row:span 2}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gallery a:hover img{transform:scale(1.04)}
.gallery .rm{position:absolute;top:6px;inset-inline-end:6px;background:var(--surface);border:0;border-radius:2px;font-size:.76rem;font-weight:700;padding:2px 8px;cursor:pointer}
.toast{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 20px;border-radius:var(--r);z-index:30;font-weight:700}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(10px);opacity:.5}}main>*{animation:rise .35s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.top-row{flex-wrap:wrap;row-gap:4px}.brand{flex-basis:100%}.who{flex:1}.who .nm{display:none}body{font-size:16px}main{gap:44px;padding-top:28px}.gallery li:first-child{grid-column:auto;grid-row:auto}}
</style>

<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <a class="brand" href="#home" id="brand">מרחב הלמידה המשותף</a>
        <div class="who" id="who"></div>
      </div>
      <nav class="tabs" id="tabs" aria-label="ניווט ראשי">
        <a href="#home">פתיחה</a>
        <a href="#sessions">המפגשים</a>
        <a href="#materials">קבצים וקישורים</a>
        <a href="#reading">המלצות קריאה</a>
        <a href="#insights">תובנות ושאלות</a>
        <a href="#feedback">משוב והצעות</a>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main">
    <div class="notice">טוען את מרחב הלמידה… אם הדף נשאר כך, יש לוודא שנכנסת עם החשבון שאליו נשלחה ההזמנה.</div>
  </main>
</div>
<div id="modal-root"></div>

<script>
(() => {
"use strict";
const SESSIONS = [1,2,3,4,5,6];
const CATS = [
  {n:1,t:"קידום שוויון הזדמנויות וצמצום פערים",q:"האם אדטק הצליח לצמצם פערי למידה, ובאיזו מידה?"},
  {n:2,t:"למידה אדפטיבית",q:"באיזו מידה הצלחנו להתאים את הלמידה לצרכים האישיים של הלומדים?"},
  {n:3,t:"קבלת החלטות מבוססת נתונים",q:"מה למדנו מאיסוף וניתוח נתוני למידה, וכיצד הם השפיעו על ההוראה והלמידה?"},
  {n:4,t:"רתימת תרבות האינטרנט",q:"כיצד אדטק רתם דפוסי התנהגות, תקשורת ולמידה שהתפתחו ברשת?"},
  {n:5,t:"יצירת מוטיבציה",q:"מה הצליח ומה לא הצליח במאמצים לעודד תלמידים ללמוד באמצעות טכנולוגיה?"},
  {n:6,t:"הסרת חסמי כניסה והטמעה בבתי הספר",q:"מה מקשה על פתרונות טכנולוגיים להיכנס לבתי הספר ולהשתלב בהם, וכיצד אפשר להסיר חסמים אלה?"},
  {n:7,t:"עידוד סטארטאפים בתחום האדטק",q:"איך אפשר לעודד הקמה וצמיחה של חברות שמפתחות פתרונות משמעותיים ללמידה?"},
];
const catName = n => (CATS.find(c => c.n === +n) || {}).t || "";
const FILE_ACCEPT = ".pdf,.png,.jpg,.jpeg,.gif,.webp,.mp4,.webm,.csv,.txt,.md";
const TYPE_BY_EXT = {pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",mp4:"video/mp4",webm:"video/webm",csv:"text/csv",txt:"text/plain",md:"text/markdown"};

const S = {
  db:null, user:null, assets:null, me:null, myId:null, isFac:false, facReal:false, preview:false, canWrite:true, ready:false,
  home:null, sessions:{}, people:{}, materials:[], reading:[], insights:[], feedback:[], myFeedback:null,
  profiles:{},
  f:{mSession:"",mTopic:"",mType:"", rSession:"", iView:"cat", iSession:"", iType:"", iCat:""},
};

const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const fmtDate = d => { if (!d) return ""; const t = new Date(d + "T12:00:00"); return isNaN(t) ? d : t.toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"}); };
const todayISO = () => new Date().toISOString().slice(0,10);
const lines = t => String(t||"").split("\n").map(s => s.trim()).filter(Boolean);
const sessName = n => { const s = S.sessions[n]; return s && s.title ? `מפגש ${n}: ${s.title}` : `מפגש ${n}`; };
const sessOptions = (sel, withNone=true, noneLabel="ללא שיוך למפגש") =>
  (withNone ? `<option value="">${noneLabel}</option>` : "") +
  SESSIONS.map(n => `<option value="${n}" ${String(sel)===String(n)?"selected":""}>${esc(sessName(n))}</option>`).join("");
const catOptions = (sel, withNone=false) =>
  (withNone ? `<option value="">כל הקטגוריות</option>` : "") +
  CATS.map(c => `<option value="${c.n}" ${String(sel)===String(c.n)?"selected":""}>${c.n}. ${esc(c.t)}</option>`).join("");

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- people ---------- */
function nameOf(uid, fallback){
  if (!uid) return fallback || "המנחה";
  const p = S.people[uid]; if (p && p.name) return p.name;
  const pr = S.profiles[uid]; if (pr && pr.name) return pr.name;
  return fallback || "משתתף/ת";
}
function avatarOf(uid){ const pr = S.profiles[uid]; return pr ? pr.avatarUrl : ""; }
async function refreshProfiles(){
  if (!S.user) return;
  const ids = new Set();
  [...S.materials, ...S.reading, ...S.insights, ...S.feedback].forEach(d => d.createdBy && ids.add(d.createdBy));
  if (S.myId) ids.add(S.myId);
  const list = [...ids].filter(Boolean);
  if (!list.length) return;
  try { const ps = await S.user.profiles(list); const changed = list.some(id => !S.profiles[id] || S.profiles[id].name !== ps[id].name); S.profiles = {...S.profiles, ...ps}; if (changed) render(); } catch {}
}
const authorHTML = (uid, label) => {
  const av = avatarOf(uid);
  return `<span class="author">${av?`<img src="${esc(av)}" alt="">`:""}<span>${esc(label || nameOf(uid))}</span></span>`;
};
const canManage = d => S.isFac || (S.myId && d.createdBy === S.myId);

/* ---------- routing ---------- */
function route(){
  const h = (location.hash || "#home").slice(1);
  if (/^session-[1-6]$/.test(h)) return {name:"session", n:+h.split("-")[1]};
  if (["home","sessions","materials","reading","insights","feedback"].includes(h)) return {name:h};
  return {name:"home"};
}
let lastRouteKey = "";
window.addEventListener("hashchange", () => { render(true); window.scrollTo(0,0); });

function setTabs(r){
  const key = r.name === "session" ? "sessions" : r.name;
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#"+key ? "page" : "false"));
}

/* ---------- render ---------- */
function render(force){
  const r = route(); setTabs(r);
  const key = r.name + (r.n||"");
  renderWho();
  const brand = (S.home && S.home.processName) || "מרחב הלמידה המשותף";
  $("#brand").textContent = brand;
  if (!S.ready) return;
  const main = $("#main");
  const routeChanged = key !== lastRouteKey; lastRouteKey = key;
  if (r.name === "feedback" && !routeChanged && !force && $("#fb-side")) { renderFeedbackSide(); return; }
  let html = notices();
  if (r.name === "home") html += viewHome();
  else if (r.name === "sessions") html += viewSessions();
  else if (r.name === "session") html += viewSession(r.n);
  else if (r.name === "materials") html += viewMaterials();
  else if (r.name === "reading") html += viewReading();
  else if (r.name === "insights") html += viewInsights();
  else if (r.name === "feedback") html += viewFeedback();
  main.innerHTML = html;
  if (r.name === "feedback") { renderFeedbackSide(); if (S.myFeedback !== null) fillFeedbackForm(); }
}

function renderWho(){
  const el = $("#who"); if (!S.me) { el.innerHTML=""; return; }
  const nm = nameOf(S.myId, S.me.name || "");
  const pv = S.facReal ? (S.preview
    ? `<span class="pill prev">תצוגת משתתף</span>`
    : `<span class="pill fac">מנחה</span><button class="btn ghost small" data-act="preview-on" type="button">לראות כמשתתף</button>`) : "";
  el.innerHTML = `${pv}<span class="nm">${esc(nm)}</span>${S.me.avatarUrl?`<img src="${esc(S.me.avatarUrl)}" alt="">`:""}<button class="btn ghost small" data-act="profile" type="button">השם שלי</button>`;
}

function notices(){
  let h = "";
  if (!S.db) return `<div class="notice warn">לא ניתן לטעון את התכנים. יש להיכנס לחשבון Claude שאליו נשלחה ההזמנה לאתר, ולרענן את הדף.</div>`;
  if (S.preview) h += `<div class="preview-bar"><span><b>תצוגת משתתף.</b> כך נראה האתר למשתתפים: בלי כפתורי עריכה של המנחה ובלי תשובות המשוב של אחרים.</span><button class="btn small" data-act="preview-off" type="button">חזרה לתצוגת מנחה</button></div>`;
  if (!S.canWrite) h += `<div class="notice">יש לך הרשאת צפייה בלבד. כדי להוסיף תכנים, יש לבקש מהמנחה הרשאת עריכה.</div>`;
  else if (S.myId && !(S.people[S.myId] && S.people[S.myId].name)) h += `<div class="notice spread"><span>איך להציג את שמך ליד התכנים שתוסיפו?</span><button class="btn small primary" data-act="profile" type="button">הגדרת שם</button></div>`;
  return h;
}

const counts = n => ({
  m: S.materials.filter(d => String(d.session)===String(n)).length,
  r: S.reading.filter(d => String(d.session)===String(n)).length,
  i: S.insights.filter(d => String(d.session)===String(n)).length,
});

function sessionCards(){
  const today = todayISO();
  // The next session: the first dated one from today on, else the first without a summary.
  const next = SESSIONS.find(n => (S.sessions[n]||{}).date >= today) || SESSIONS.find(n => !(S.sessions[n]||{}).summary);
  return `<ul class="sessions">${SESSIONS.map(n => {
    const s = S.sessions[n] || {}; const c = counts(n);
    const up = !s.date || s.date > today;
    const total = c.m + c.r + c.i;
    return `<li><a class="s-card ${up?"upcoming":""} ${n===next?"next":""}" href="#session-${n}">
      <span class="s-num">${n}</span>${n===next?`<span class="s-flag">המפגש הבא</span>`:""}
      <span class="s-date">${s.date?esc(fmtDate(s.date)):"תאריך יעודכן"}</span>
      <span class="s-title">${esc(s.title || (up?"מפגש קרוב":"מפגש "+n))}</span>
      <span class="s-meta">${s.summary?"יש סיכום · ":""}${total?total+" פריטים":"עדיין אין פריטים"}</span>
    </a></li>`;}).join("")}</ul>`;
}

function viewHome(){
  const h = S.home || {};
  const edit = S.isFac ? `<button class="btn small" data-act="edit-home" type="button">עריכת עמוד הפתיחה</button>` : "";
  const ctx = (h.purpose || h.why || h.question) ? `
    <section class="context" aria-label="על התהליך">
      <div><h3>מטרת התהליך</h3><p>${esc(h.purpose||"")}</p></div>
      <div><h3>למה התהליך הזה</h3><p>${esc(h.why||"")}</p></div>
      <div class="ctx-q"><h3>השאלה המרכזית שמלווה אותנו</h3><p>${esc(h.question||"")}</p></div>
    </section>` : `<div class="empty">כאן יופיע טקסט ההקשר: מטרת התהליך, הסיבה לקיומו והשאלה המרכזית.${S.isFac?" אפשר להוסיף אותו בכפתור העריכה.":""}</div>`;
  const summaries = SESSIONS.filter(n => S.sessions[n] && S.sessions[n].summary).length;
  return `
  <section class="hero">
    <div class="spread"><span class="eyebrow">${esc(h.processName || "תהליך למידה בן שישה מפגשים")}</span>${edit}</div>
    <h1>${esc(h.title || "מרחב הלמידה המשותף")}</h1>
    ${ctx}
  </section>
  <section class="cat">
    <div class="sec-head"><h2>ששת המפגשים</h2><p>לכל מפגש עמוד עם סיכום, חומרים ותובנות</p></div>
    ${sessionCards()}
  </section>
  <section class="cat">
    <div class="sec-head"><h2>גישה מהירה</h2></div>
    <div class="quick">
      <a class="q-tile" href="#sessions"><span class="big">${summaries}</span><b>סיכומי המפגשים</b><span class="count">מתוך 6 פורסמו</span></a>
      <a class="q-tile" href="#materials"><span class="big">${S.materials.length}</span><b>ספריית החומרים</b><span class="count">קבצים וקישורים</span></a>
      <a class="q-tile" href="#reading"><span class="big">${S.reading.length}</span><b>המלצות קריאה</b><span class="count">ספרים ומקורות</span></a>
      <a class="q-tile" href="#insights"><span class="big">${S.insights.length}</span><b>תובנות ושאלות</b><span class="count">${S.insights.filter(d=>d.type!=="question").length} תובנות · ${S.insights.filter(d=>d.type==="question").length} שאלות</span></a>
    </div>
  </section>`;
}

function viewSessions(){
  return `<section class="cat"><div class="sec-head"><h2>המפגשים</h2><p>סיכומים רשמיים של המנחה, לצד מה שהוסיפו המשתתפים</p></div>${sessionCards()}</section>
  <section class="list">${SESSIONS.map(n => { const s=S.sessions[n]||{}; return `<article class="item ${s.summary?"is-official":""}">
    <div class="spread"><h3><a href="#session-${n}">${esc(sessName(n))}</a></h3><span class="s-date">${s.date?esc(fmtDate(s.date)):"תאריך יעודכן"}</span></div>
    ${s.summary?`<span class="official-tag">סיכום רשמי</span><p>${esc(s.summary.length>260?s.summary.slice(0,260)+"…":s.summary)}</p>`:`<p class="empty-soft">הסיכום עדיין לא פורסם.</p>`}
  </article>`;}).join("")}</section>`;
}

function viewSession(n){
  const s = S.sessions[n] || {};
  const c = counts(n);
  const topics = lines(s.topics), ins = lines(s.insights);
  const mats = S.materials.filter(d => String(d.session)===String(n));
  const books = S.reading.filter(d => String(d.session)===String(n));
  const its = S.insights.filter(d => String(d.session)===String(n));
  return `
  <section class="s-head">
    <a href="#sessions" class="hint">← כל המפגשים</a>
    <span class="eyebrow">מפגש ${n} מתוך 6 · ${s.date?esc(fmtDate(s.date)):"תאריך יעודכן"}</span>
    <h1>${esc(s.title || "מפגש "+n)}</h1>
    ${s.description?`<p class="desc">${esc(s.description)}</p>`:""}
    ${S.isFac?`<div><button class="btn small" data-act="edit-session" data-n="${n}" type="button">עריכת פרטי המפגש והסיכום</button></div>`:""}
  </section>
  <section class="panel-off" aria-label="סיכום רשמי">
    <span class="official-tag">סיכום רשמי · מאת המנחה</span>
    <div><h3>סיכום המפגש</h3>${s.summary?`<p class="body">${esc(s.summary)}</p>`:`<p class="empty-soft">הסיכום יפורסם אחרי המפגש.</p>`}</div>
    <div class="two">

      <div><h3>תובנות מרכזיות</h3>${ins.length?`<ul>${ins.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:`<p class="empty-soft">טרם עודכן.</p>`}</div>

  </section>

  <section class="cat">
    <div class="sec-head"><h2>קבצים וקישורים</h2>${S.canWrite?`<button class="btn small primary" data-act="add-material" data-session="${n}" type="button">הוספת קובץ או קישור</button>`:""}</div>
    ${mats.length?`<ul class="grid2">${mats.map(materialCard).join("")}</ul>`:`<div class="empty">עדיין לא נוספו חומרים למפגש הזה.</div>`}

  <section class="cat">
    <div class="sec-head"><h2>ספרים ומקורות קריאה שהוזכרו</h2>${S.canWrite?`<button class="btn small primary" data-act="add-reading" data-session="${n}" type="button">הוספת המלצה</button>`:""}</div>
    ${books.length?`<ul class="grid2">${books.map(readingCard).join("")}</ul>`:`<div class="empty">עדיין לא נוספו המלצות קריאה למפגש הזה.</div>`}
  </section>
  <section class="cat">
    <div class="sec-head"><h2>תובנות ושאלות מהמשתתפים</h2>${S.canWrite?`<button class="btn small primary" data-act="add-insight" data-session="${n}" type="button">הוספת תובנה או שאלה</button>`:""}</div>
    ${its.length?`<ul class="list">${its.map(d=>insightCard(d,true)).join("")}</ul>`:`<div class="empty">עדיין לא נוספו תובנות או שאלות מהמפגש הזה.</div>`}
  </section>
  <nav class="s-pager" aria-label="מעבר בין מפגשים">
    ${n>1?`<a class="btn" href="#session-${n-1}">→ מפגש ${n-1}</a>`:"<span></span>"}
    ${n<6?`<a class="btn" href="#session-${n+1}">מפגש ${n+1} ←</a>`:"<span></span>"}
  </nav>`;
}

function galleryHTML(n, s){
  const photos = Array.isArray(s.photos) ? s.photos : [];
  const canAdd = S.isFac && S.assets;
  if (!photos.length && !canAdd) return "";
  return `<section class="cat">
    <div class="sec-head"><h2>תמונות מהמפגש</h2>${canAdd?`<label class="btn small primary" for="ph-${n}">הוספת תמונות</label><input type="file" id="ph-${n}" data-photos="${n}" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>`:""}</div>
    ${photos.length?`<ul class="gallery">${photos.map(id=>`<li><a href="/_blob/${esc(encodeURIComponent(id))}" target="_blank" rel="noopener"><img src="/_blob/${esc(encodeURIComponent(id))}" alt="תמונה ממפגש ${n}" loading="lazy"></a>${S.isFac?`<button class="rm" type="button" data-act="rm-photo" data-n="${n}" data-id="${esc(id)}">הסרה</button>`:""}</li>`).join("")}</ul>`:`<div class="empty">עדיין לא נוספו תמונות.</div>`}
  </section>`;
}
async function savePhotos(n, photos){
  const ref = S.db.doc("official/session-"+n);
  if (S.sessions[n]) await ref.update({photos, updatedAt:Date.now()}); else await ref.set({photos, updatedAt:Date.now()});
}

function matType(d){
  if (d.kind === "link") return "link";
  const t = d.contentType || "";
  if (t === "application/pdf") return "pdf";
  if (t.startsWith("image/")) return "image";
  if (t.startsWith("video/")) return "video";
  return "doc";
}
const TYPE_LABEL = {link:"קישור",pdf:"PDF",image:"תמונה",video:"וידאו",doc:"מסמך"};
function materialHref(d){ return d.kind === "link" ? safeUrl(d.url) : (d.assetId ? "/_blob/" + encodeURIComponent(d.assetId) : ""); }

function materialCard(d){
  const href = materialHref(d); const t = matType(d);
  return `<li class="item ${d.official?"is-official":""}">
    <div class="meta"><span class="chip kind">${TYPE_LABEL[t]}</span>${d.official?`<span class="chip off">רשמי</span>`:""}${d.topic?`<span class="chip">${esc(d.topic)}</span>`:""}</div>
    <h3>${href?`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(d.title)}</a>`:esc(d.title)}</h3>
    ${d.desc?`<p>${esc(d.desc)}</p>`:""}
    <div class="meta">${authorHTML(d.createdBy)}${d.session?`<a href="#session-${esc(d.session)}">מפגש ${esc(d.session)}</a>`:""}${d.fileName?`<span>${esc(d.fileName)}</span>`:""}</div>
    ${canManage(d)?`<div class="actions"><button class="btn small" data-act="edit-material" data-id="${esc(d.id)}" type="button">עריכה</button></div>`:""}
  </li>`;
}
function readingCard(d){
  const link = safeUrl(d.link);
  return `<li class="item">
    <h3>${esc(d.title)}</h3>
    ${d.author?`<span class="book-by">${esc(d.author)}</span>`:""}
    ${d.why?`<p>${esc(d.why)}</p>`:""}
    <div class="meta"><span>הומלץ על ידי ${esc(d.recommendedBy || nameOf(d.createdBy))}</span>${d.session?`<a href="#session-${esc(d.session)}">מפגש ${esc(d.session)}</a>`:""}${link?`<a href="${esc(link)}" target="_blank" rel="noopener">מידע נוסף</a>`:""}</div>
    ${d.createdBy?`<div class="meta">נוסף על ידי ${authorHTML(d.createdBy)}</div>`:""}
    ${canManage(d)?`<div class="actions"><button class="btn small" data-act="edit-reading" data-id="${esc(d.id)}" type="button">עריכה</button></div>`:""}
  </li>`;
}
function insightCard(d, showCat){
  const q = d.type === "question";
  return `<li class="ins ${q?"question":""}">
    <div class="meta"><span class="chip ${q?"q":"kind"}">${q?"שאלה":"תובנה"}</span>${showCat&&d.category?`<span class="chip">${esc(d.category)}. ${esc(catName(d.category))}</span>`:""}</div>
    <p>${esc(d.text)}</p>
    <div class="meta">${authorHTML(d.createdBy)}${d.session?`<a href="#session-${esc(d.session)}">מפגש ${esc(d.session)}</a>`:"<span>ללא מפגש</span>"}

  </li>`;
}

function viewMaterials(){
  const f = S.f;

  const items = S.materials.filter(d =>
    (!f.mSession || String(d.session||"none")===f.mSession) &&

    <div class="filters">
      <label>מפגש<select id="f-mSession" data-filter="mSession"><option value="">כל המפגשים</option>${SESSIONS.map(n=>`<option value="${n}" ${f.mSession==String(n)?"selected":""}>מפגש ${n}</option>`).join("")}<option value="none" ${f.mSession==="none"?"selected":""}>ללא שיוך</option></select></label>
      <label>נושא<select id="f-mTopic" data-filter="mTopic"><option value="">כל הנושאים</option>${topics.map(t=>`<option ${f.mTopic===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>

function renderFeedbackSide(){

/* ---------- modals ---------- */
let modalCleanup = null;
function openModal(html, onSubmit, onMount){
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" id="ov"><form class="modal" id="mf" novalidate>${html}
    <p class="err" id="m-err" hidden></p>
    <div class="spread"><div class="row"><button class="btn primary" type="submit" id="m-save">שמירה</button><button class="btn" type="button" data-close>ביטול</button></div><div class="row" id="m-extra"></div></div>
  </form></div>`;
  const form = $("#mf");
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  root.querySelector("[data-close]").onclick = close;
  $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") close(); });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#m-err"); err.hidden = true;
    const btn = $("#m-save"); btn.disabled = true; btn.textContent = "שומר…";
    try { await onSubmit(form); close(); }
    catch (x) { err.textContent = x && x.userMsg ? x.userMsg : saveError(x); err.hidden = false; btn.disabled = false; btn.textContent = "שמירה"; }
  });
  if (onMount) onMount(form, close);
  const first = form.querySelector("input:not([type=hidden]):not([type=radio]),textarea,select"); if (first) first.focus();
}
function saveError(x){
  const c = x && x.code;
  if (c === "invalid_argument") return "השמירה נדחתה. ייתכן שאין לך הרשאה לשנות את הפריט הזה.";
  if (c === "quota_exceeded") return "המאגר התמלא. יש לפנות למנחה.";
  if (c === "too_large") return "הקובץ גדול מדי (עד 20MB).";
  if (c === "unsupported_type") return "סוג הקובץ אינו נתמך. אפשר להעלות PDF, תמונה, וידאו או טקסט, או לצרף קישור.";
  return "השמירה לא הצליחה. נסו שוב בעוד רגע.";
}
const fail = m => { const e = new Error(m); e.userMsg = m; return e; };
function addDelete(form, close, doc, coll){
  const ex = $("#m-extra"); let armed = false;
  const b = document.createElement("button"); b.type="button"; b.className="btn danger small"; b.textContent="מחיקה";
  b.onclick = async () => {
    if (!armed) { armed = true; b.textContent = "ללחוץ שוב לאישור המחיקה"; return; }
    b.disabled = true;
    try {
      await S.db.doc(coll + "/" + doc.id).delete();
      if (doc.assetId && S.assets) { try { await S.assets.delete(doc.assetId); } catch {} }
      close(); toast("נמחק");
    } catch (x) { const err=$("#m-err"); err.textContent = saveError(x); err.hidden=false; b.disabled=false; }
  };
  ex.appendChild(b);
}
const stamp = (d, isNew) => isNew ? {...d, createdBy:S.myId, createdAt:Date.now(), updatedAt:Date.now()} : {...d, updatedAt:Date.now(), updatedBy:S.myId};

      :`<p class="notice">העלאת קבצים אינה זמינה בחשבון שלך כרגע. אפשר להעלות את הקובץ ל-Google Drive או לשירות דומה ולצרף כאן קישור.</p>`}

  async form => {

    if (kind === "link") {

  const s = S.sessions[n] || {};
  openModal(`<h2>עריכת מפגש ${n}</h2>
    <div class="two"><label class="field"><span>תאריך</span><input type="date" id="s-date" name="date" value="${esc(s.date||"")}"></label>
    <label class="field"><span>כותרת</span><input type="text" id="s-title" name="title" value="${esc(s.title||"")}"></label></div>
    <label class="field"><span>תיאור קצר</span><textarea id="s-desc" name="description">${esc(s.description||"")}</textarea></label>
    <label class="field"><span>סיכום המפגש</span><textarea id="s-sum" name="summary" style="min-height:180px">${esc(s.summary||"")}</textarea></label>
    <label class="field"><span>נושאים ושאלות שעלו</span><textarea id="s-topics" name="topics">${esc(s.topics||"")}</textarea><small>כל שורה תוצג כפריט ברשימה.</small></label>
    <label class="field"><span>תובנות מרכזיות</span><textarea id="s-ins" name="insights">${esc(s.insights||"")}</textarea><small>כל שורה תוצג כפריט ברשימה.</small></label>`,
  async form => {
    const out = {}; ["date","title","description","summary","topics","insights"].forEach(k => out[k] = form[k].value.trim());
    await S.db.doc("official/session-"+n).set({...out, updatedAt:Date.now()}); toast("המפגש עודכן");
  });
}
function profileModal(){
  const cur = (S.people[S.myId]||{}).name || (S.me && S.me.name) || "";
  openModal(`<h2>השם שלי</h2><label class="field"><span>השם שיוצג ליד התכנים שתוסיפו</span><input type="text" id="p-name" name="name" value="${esc(cur)}"></label>`,
  async form => {
    const name = form.name.value.trim(); if (!name) throw fail("יש להזין שם.");
    await S.db.doc("people/"+S.myId).set({name, updatedAt:Date.now()}); toast("השם נשמר");
  });
}

/* ---------- events ---------- */
/* Facilitator "view as participant": hides facilitator-only controls and data, nothing is written. */
function setPreview(on){
  S.preview = !!on && S.facReal; S.isFac = S.facReal && !S.preview;
  try { sessionStorage.setItem("previewAsParticipant", S.preview ? "1" : ""); } catch {}
  $("#modal-root").innerHTML = "";
  render(true); window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-view]"); if (!b) return;
  if (b.dataset.view) { S.f.iView = b.dataset.view; render(true); return; }
  const a = b.dataset.act, id = b.dataset.id;
  const find = (arr) => arr.find(x => x.id === id);
  const preset = {session:b.dataset.session||"", cat:b.dataset.cat||""};
  if (a === "preview-on" || a === "preview-off") { setPreview(a === "preview-on"); return; }
  if (!S.db) return;
  if (a === "profile") { if (S.myId && S.canWrite) profileModal(); }
  else if (a === "edit-home") homeModal();
  else if (a === "edit-session") sessionModal(+b.dataset.n);
  else if (a === "add-material") materialModal(null, preset);
  else if (a === "add-reading") readingModal(null, preset);
  else if (a === "add-insight") insightModal(null, preset);
  else if (a === "edit-material") { const d = find(S.materials); d && materialModal(d); }
  else if (a === "edit-reading") { const d = find(S.reading); d && readingModal(d); }
  else if (a === "edit-insight") { const d = find(S.insights); d && insightModal(d); }
  else if (a === "rm-photo") {
    const n = +b.dataset.n;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "לאשר הסרה"; return; }
    const photos = ((S.sessions[n]||{}).photos||[]).filter(x => x !== id);
    savePhotos(n, photos).then(() => { S.assets && S.assets.delete(id).catch(()=>{}); toast("התמונה הוסרה"); }).catch(x => toast(saveError(x)));
  }
});
document.addEventListener("change", e => {
  const f = e.target.dataset && e.target.dataset.filter;
  if (f) { S.f[f] = e.target.value; render(true); return; }
  if (e.target.id === "fb-session") fillFeedbackForm();
  if (e.target.dataset && e.target.dataset.photos) {
    const n = +e.target.dataset.photos; const files = [...e.target.files];
    if (!files.length || !S.assets) return;
    (async () => {
      const ids = [];
      for (const [i, f] of files.entries()) {
        toast(`מעלה תמונה ${i+1} מתוך ${files.length}…`);
        const ext = (f.name.split(".").pop()||"").toLowerCase();
        try { const r = await S.assets.upload(f, {type: TYPE_BY_EXT[ext] || f.type}); ids.push(r.id); } catch (x) { toast(saveError(x)); }
      }
      if (ids.length) { await savePhotos(n, [...((S.sessions[n]||{}).photos||[]), ...ids]); toast(`נוספו ${ids.length} תמונות`); }
    })().catch(x => toast(saveError(x)));
  }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "fb-form") return;
  e.preventDefault();
  const form = e.target; const st = $("#fb-status");
  const key = form.session.value || "general";
  const rating = (form.querySelector("input[name=rating]:checked")||{}).value || "";
  const r = {rating, good:form.good.value.trim(), improve:form.improve.value.trim(), topics:form.topics.value.trim(), guests:form.guests.value.trim(), updatedAt:Date.now()};
  if (!rating && !r.good && !r.improve && !r.topics && !r.guests) { st.textContent = "יש למלא לפחות שדה אחד."; return; }
  const responses = {...((S.myFeedback||{}).responses||{}), [key]: r};
  st.textContent = "שומר…";
  try { await S.db.doc("feedback/"+S.myId).set({responses, updatedAt:Date.now()}); S.myFeedback = {responses}; st.textContent = "תודה! המשוב נשמר."; }
  catch (x) { st.textContent = saveError(x); }
});

/* ---------- boot ---------- */
async function boot(){
  if (!window.claude || !window.claude.use) { S.ready = true; render(true); return; }
  const [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
  S.db = db; S.user = user; S.assets = assets;
  if (user) {
    const [me, isOwner, can] = await Promise.all([user.me(), user.isOwner(), user.can("data.write")]);
    S.me = me; S.myId = me.id; S.isFac = isOwner; S.facReal = !!isOwner; S.canWrite = can !== false;
  }
  if (!db) { S.canWrite = false; S.ready = true; render(true); return; }
  if (!S.myId) S.canWrite = false;
  const onErr = () => {};
  const pending = new Set(["official","materials","reading","insights","people"]);
  const done = k => { pending.delete(k); if (!pending.size && !S.ready) { S.ready = true; } render(); refreshProfiles(); };
  db.collection("official").onSnapshot(snap => {
    const sessions = {}; let home = null;
    snap.docs.forEach(d => { const v = d.data(); if (d.id === "home") home = v; const m = /^session-(\d)$/.exec(d.id); if (m) sessions[+m[1]] = v; });
    S.home = home; S.sessions = sessions; done("official");
  }, onErr);
  const list = (name, key) => db.collection(name).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); done(name);
  }, onErr);
  list("materials","materials"); list("reading","reading"); list("insights","insights");
  db.collection("people").onSnapshot(snap => { const p = {}; snap.docs.forEach(d => p[d.id] = d.data()); S.people = p; done("people"); }, onErr);
  if (S.isFac) db.collection("feedback").onSnapshot(snap => { S.feedback = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); refreshProfiles(); }, onErr);
  if (S.myId) db.doc("feedback/"+S.myId).onSnapshot(d => { const first = S.myFeedback === null; S.myFeedback = d.exists ? d.data() : {}; if (first) fillFeedbackForm(); }, onErr);
  try { if (S.facReal && sessionStorage.getItem("previewAsParticipant")) setPreview(true); } catch {}
  setTimeout(() => { if (!S.ready) { S.ready = true; render(true); } }, 6000);
}
render(true);
boot();
})();
</script>
